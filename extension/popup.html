<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>yt-dlp Video Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>yt-dlp Downloader</span>
      </div>
      <span class="badge" id="hostStatus">Checking Host...</span>
    </div>

    <div class="form-group">
      <label for="videoUrl">Video URL:</label>
      <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." />
    </div>

    <div class="form-group">
      <label for="quality">Quality & Format:</label>
      <select id="quality">
        <option value="best">Best Quality (Original / MP4)</option>
        <option value="1080p">1080p Full HD (MP4 H.264)</option>
        <option value="720p">720p HD (MP4 H.264)</option>
        <option value="mp3">Audio Only (MP3 via FFmpeg)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="downloadFolder">Save Location:</label>
      <div class="input-with-button">
        <input type="text" id="downloadFolder" placeholder="Default (~/Downloads)" />
        <button type="button" id="browseBtn" class="btn-secondary" title="Choose Download Folder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          Browse...
        </button>
      </div>
    </div>

    <button id="downloadBtn" class="btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download Video
    </button>

    <div id="progressContainer" class="progress-box hidden">
      <div class="progress-info">
        <span id="statusText">Starting download...</span>
        <span id="percentText">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div class="speed-eta">
        <span id="speedText">-- MiB/s</span>
        <span id="etaText">ETA: --</span>
      </div>
    </div>

    <div id="logArea" class="log-area hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
